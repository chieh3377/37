<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyword Search Tool</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .search-container {
            position: relative;
            margin-bottom: 30px;
        }
        input[type="text"] {
            width: 100%;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #bdc3c7;
            border-radius: 30px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        input[type="text"]:focus {
            border-color: #3498db;
        }
        #results {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .result-card {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-left: 5px solid #3498db;
        }
        .keyword-title {
            font-size: 20px;
            font-weight: bold;
            color: #2980b9;
            margin-bottom: 8px;
        }
        .keyword-desc {
            font-size: 15px;
            color: #555;
            line-height: 1.5;
        }
        .highlight {
            background-color: #f1c40f;
            font-weight: bold;
            color: #000;
            padding: 0 2px;
            border-radius: 3px;
        }
        .no-result {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
            margin-top: 20px;
        }
        .hint {
            text-align: center;
            font-size: 13px;
            color: #95a5a6;
            margin-top: -20px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <h2>Final Exam Keyword Finder</h2>
    <div class="hint">Type the first few words of the description to find the matching keyword.</div>
    
    <div class="search-container">

    </div>

    <div id="results"></div>

        ];

        const searchInput = document.getElementById('searchInput');
        const resultsDiv = document.getElementById('results');

        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            resultsDiv.innerHTML = ''; // Clear old results

            if (!query) return; // If search is empty, do nothing

            // Filter data that includes the query text
            const matches = data.filter(item => item.desc.toLowerCase().includes(query));

            // If no match is found
            if (matches.length === 0) {
                resultsDiv.innerHTML = '<div class="no-result">No exact match found. Please check your spelling and try again.</div>';
                return;
            }

            // Display matches
            matches.forEach(item => {
                const card = document.createElement('div');
                card.className = 'result-card';
                
                // Highlight the matching text
                const regex = new RegExp(`(${query})`, 'gi');
                const highlightedDesc = item.desc.replace(regex, '<span class="highlight">$1</span>');

                card.innerHTML = `
                    <div class="keyword-title">${item.name}</div>
                    <div class="keyword-desc">${highlightedDesc}</div>
                `;
                resultsDiv.appendChild(card);
            });
        });
    </script>
</body>
</html>
